[package]
name = "eon-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
eon-workspace-protocol = { path = "../eon-workspace-protocol" }
libc = "=0.2.189"
orbit-protocol = { git = "https://github.com/Yazelix/eon-sessions.git", rev = "b6cecf8f2ee35570b41cfdc578b095889d917fe2" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
socket2 = "=0.6.5"
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
